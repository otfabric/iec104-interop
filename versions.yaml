# Machine-readable version manifest for iec104-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles and adapters/openmuc/pom.xml are the source of truth for a
# build: scripts/check-versions.sh fails when this file disagrees with them.

interop_version: "0.1.0"
contract_version: "1.0"        # docs/CONTAINER_CONTRACT.md, schemaVersion of every document
fixture_schema: "1.0"          # fixtures/schema/iec104-fixture.schema.json

protocol:
  name: "IEC 60870-5-104"
  default_port: 2404

implementations:
  lib60870:
    priority: P0
    status: published
    upstream: "MZ Automation lib60870-C"
    repository: "https://github.com/mz-automation/lib60870"
    version: "v2.4.1"            # latest release
    revision: "7a388e3e133999e1ca77ba7521d55d074b7cd2bc"
    license: "GPL-3.0"
    language: "C"
    independent_engine: true
    roles: [server, client]

  openmuc:
    priority: P0
    status: published
    upstream: "OpenMUC j60870"
    repository: "https://www.openmuc.org/iec-60870-5-104/"
    artifact: "org.openmuc:j60870"
    version: "1.7.2"
    license: "GPL-3.0"
    language: "Java"
    independent_engine: true
    roles: [server, client]
    latest: "1.8.0"
    note: >-
      Deliberately one release behind. 1.8.0 (2026-07-17) cannot decode
      C_RD_NA_1 and closes the connection when it receives one; it adds no
      protocol functionality over 1.7.2. It is built and self-tested as a
      candidate (make candidate-openmuc) with that bug listed in
      tests/known-bugs.tsv. See docs/COMPATIBILITY.md.

  wendy512:
    priority: P1
    status: planned
    upstream: "wendy512/iec104"
    repository: "https://github.com/wendy512/iec104"
    license: "Apache-2.0"
    language: "Go"
    independent_engine: true

  oneofour:
    priority: P1
    status: planned
    upstream: "Eclipse OneOFour"
    repository: "https://github.com/eclipse-oneofour/oneofour"
    language: "Java"
    independent_engine: true

  fraunhofer:
    priority: P2
    status: planned
    upstream: "Fraunhofer FIT iec104-python"
    repository: "https://github.com/Fraunhofer-FIT-DIEN/iec104-python"
    license: "GPL-3.0"
    language: "Python / C++"
    # Wraps lib60870-C: useful coverage, but not another protocol engine.
    independent_engine: false

dependencies:
  gson: "2.14.0"               # openmuc adapter, Apache-2.0
  cjson: "debian trixie libcjson1"     # lib60870 adapter, MIT

base_images:
  # Digests recorded 2026-10-09; the Dockerfiles pin these by digest.
  debian_trixie_slim: "docker.io/library/debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f"
  maven_3_9_temurin_25: "docker.io/library/maven:3.9-eclipse-temurin-25@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976"
  temurin_25_jre_noble: "docker.io/library/eclipse-temurin:25-jre-noble@sha256:d9a39a23634650173f1e2bbc176227af9728587ecf0f4b62d53e9355cd7a19ab"

images:
  lib60870: "ghcr.io/otfabric/iec104-interop-lib60870"
  openmuc: "ghcr.io/otfabric/iec104-interop-openmuc"

platforms:
  - "linux/amd64"
  - "linux/arm64"
