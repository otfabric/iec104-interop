name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Nightly: catches drift in what the pinned builds fetch.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Fixtures, versions, scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: versions.yaml matches the build files
        run: scripts/check-versions.sh
      - name: Fixtures
        run: python3 scripts/validate-fixtures.py --require-schema
      - name: Shellcheck
        run: make lint
      - name: No reference to a library under test
        # REQUIREMENTS.md R1: adapters, fixtures, scripts and schemas must not
        # know any consumer. Documentation may name consumers as examples.
        run: |
          if grep -rInE 'go-iec104|otfabric/go-' adapters fixtures schemas scripts tests Makefile compose.yaml; then
            echo "::error::consumer-specific reference found"; exit 1
          fi

  selftest:
    name: Build, smoke, cross-stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - uses: docker/setup-buildx-action@v4

      - name: Build images
        run: make images

      - name: Capabilities
        run: make capabilities | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke, cross-stack self-test, document schemas
        run: make documents

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p reports/logs
          for c in $(docker ps -aq --filter "label=iec104-interop.run"); do
            docker logs "$c" > "reports/logs/${c}.log" 2>&1 || true
          done

      - name: Upload documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-documents
          path: reports/
          if-no-files-found: ignore

  multiarch:
    name: Build linux/amd64 + linux/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build both platforms (no push)
        run: make buildx
